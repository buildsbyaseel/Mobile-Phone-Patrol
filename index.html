<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mt Olive Mediterranean Grill in Dyer, Indiana. Shawarma, gyros, grilled plates, catering and late-night hours." />
    <meta name="theme-color" content="#13201a" />
    <title>Mt Olive Mediterranean Grill | Dyer, Indiana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" src="/src/main.jsx"></script>
    <style>
      html { background: #ffffff; }
      body { margin: 0; background: #ffffff; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <!-- Netlify Forms detects the form at deploy time from this static copy. The React form in
         src/App.jsx (CateringPage) posts to it by name, so the field names below must match. -->
    <form name="catering" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="date" />
      <input type="number" name="guests" />
      <input type="text" name="occasion" />
      <input type="text" name="service" />
      <textarea name="notes"></textarea>
    </form>
    <div id="root"></div>
  </body>
</html>
